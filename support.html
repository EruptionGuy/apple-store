<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apple Store - Support</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <img src="./logo.svg">
        <a href="index.html">Store</a>
        <a href="policy.html">Policy</a>
        <a href="support.html">Support</a>
    </nav>
    <header style="background-image: linear-gradient(0deg, #3671EF, #2C4095);">
        <h1><img src="./logo.svg" style="width: 40px; filter: invert(100%)"> Support</h1>
        <p>Expert Help, Apple-Certified.</p>
    </header>
    <main>
        <h2 style="text-align: center;">Experiencing difficulties? Our support team is ready to help</h2>
        <form action="./support_submit.html">
            <div class="name">
                <div style="margin-right: 5%;">
                    <p>First Name <span class="required">*</span></p>
                    <input type="text" placeholder="John" required>
                </div>
                <div>
                    <p>Last Name <span class="required">*</span></p>
                    <input type="text" placeholder="Doe" required>
                </div>
            </div>
            <p>Email <span class="required">*</span></p>
            <input type="email" placeholder="you@domain.com" required>
            <p>Issue <span class="required">*</span></p>
            <textarea placeholder="Type your issue here..." required></textarea>
            <input type="submit" value="Contact Us">
        </form>
    </main>
    <footer>
        <h2><img src="./logo.svg" style="width: 40px; filter: invert(100%)"> Store</h2>
        <p class="slogan">Think Different. Shop Different.</p>
        <p><a href="./index.html">Store</a> | <a href="./policy.html">Policy</a> | <a href="./support.html">Support</a></p>
        <br><br>
        <hr style="border: 0.5px solid #7f7f7f;">
        <p style="color: #eeeeee">Copyright &copy; 2024 Apple Inc. All rights reserved.</p>
    </footer>
</body>
</html>
